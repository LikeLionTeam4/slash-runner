name: test

# 다른 서비스(api·nlu·llm)의 test→container-build→publish-image→bump-dev-tag와 같은
# 구조를 데스크톱 배포에 맞게 옮긴 것 — 이 저장소는 컨테이너/ECR이 아니라 PyInstaller
# 실행 파일을 배포하므로, "이미지 publish"에 해당하는 단계가 "macOS·Windows 패키징"이고
# "dev 배포"에 해당하는 단계가 "버전 태그로 GitHub Release 발행"이다. 다른 서비스들이
# dev push 시 사람 확인 없이 자동으로 실제 배포까지 이어지는 것과 같은 방침으로, v* 태그
# push도 사람 재확인 없이 Release 발행까지 자동으로 이어진다.

on:
  pull_request:
  push:
    branches: [main, dev]
    tags: ["v*"]

defaults:
  run:
    working-directory: slash-python-pc-runner

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[build,test]"
      - run: pytest

  package-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[build]"
      - run: pyinstaller slash_pc_runner.spec
      # 스모크 테스트 — 패키징된 실행 파일이 뜨자마자 죽지 않는지만 본다. tray_app.py는
      # GUI 글루 코드라 이 저장소에 단위 시험이 없고(test/tray-app-regression#34가
      # setup() 내부 로직은 잡지만, "PyInstaller가 만든 실제 바이너리가 실행되는가"
      # 자체는 별개 질문이다), 지금까지 이런 결함은 사람이 배포판을 직접 실행해서만
      # 잡혔다. 최소한 "뜨자마자 크래시"만이라도 PR 단계에서 걸러낸다.
      - name: 스모크 테스트 — 크래시 없이 뜨는지 확인
        run: |
          dist/Slash.app/Contents/MacOS/Slash &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            echo "정상 — 5초 뒤에도 살아있음"
            kill $PID
          else
            echo "실패 — 실행 후 크래시했거나 즉시 종료됨"
            exit 1
          fi
      # 얼린 실행 파일에 CA 인증서 번들이 실제로 딸려 왔는지 확인 — 개발 모드는 시스템
      # Python이 OS 인증서 저장소를 찾아 문제가 없어서 이 결함이 그동안 안 걸렸다
      # (resources.configure_ssl_certificates() 참고).
      - name: 스모크 테스트 — 인증서 번들로 HTTPS 접속 되는지 확인
        run: env -u SSL_CERT_FILE dist/Slash.app/Contents/MacOS/Slash --ssl-selfcheck
      # zip -r 대신 ditto를 쓴다 — .app 번들의 리소스 포크·확장 속성을 보존하며 압축하는
      # macOS 표준 방식이다(Apple 공식 배포 가이드에서 권장하는 방법).
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Slash.app Slash-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Slash-macOS-arm64
          path: slash-python-pc-runner/Slash-macOS-arm64.zip
          retention-days: 14

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[build]"
      - run: pyinstaller slash_pc_runner_windows.spec
      - name: 스모크 테스트 — 크래시 없이 뜨는지 확인
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Slash\Slash.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "실패 — 실행 후 크래시했거나 즉시 종료됨(종료 코드: $($proc.ExitCode))"
            exit 1
          } else {
            Write-Host "정상 — 5초 뒤에도 살아있음"
            Stop-Process -Id $proc.Id -Force
          }
      - name: 스모크 테스트 — 인증서 번들로 HTTPS 접속 되는지 확인
        shell: pwsh
        run: |
          $env:SSL_CERT_FILE = $null
          & "dist\Slash\Slash.exe" --ssl-selfcheck
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - run: Compress-Archive -Path dist/Slash -DestinationPath Slash-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Slash-Windows-x64
          path: slash-python-pc-runner/Slash-Windows-x64.zip
          retention-days: 14

  # v* 태그 push에서만 실행 — 다른 서비스의 bump-dev-tag와 같은 방침으로, 태그를 만든 것
  # 자체가 이미 팀의 배포 결정이라 여기서 다시 사람 확인을 받지 않는다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      # 배포 파일명에 버전을 붙인다 — 여러 버전을 내려받아도 파일명만 보고 구분할 수 있게.
      # package-macos/package-windows job 자체의 zip 이름은 안 건드린다(PR·dev push에서도
      # 도는 job이라 태그 없는 ref에서는 github.ref_name이 브랜치명·PR 병합 ref라 파일명에
      # 쓰기 부적절 — release job은 태그 push에서만 돌아 여기서는 안전하다).
      - run: |
          mv Slash-macOS-arm64/Slash-macOS-arm64.zip Slash-macOS-arm64/Slash-macOS-arm64-${{ github.ref_name }}.zip
          mv Slash-Windows-x64/Slash-Windows-x64.zip Slash-Windows-x64/Slash-Windows-x64-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          # v0.3.0-pre처럼 태그 이름에 pre가 들어가면 프리릴리스로 표시한다.
          prerelease: ${{ contains(github.ref_name, 'pre') }}
          files: |
            Slash-macOS-arm64/Slash-macOS-arm64-${{ github.ref_name }}.zip
            Slash-Windows-x64/Slash-Windows-x64-${{ github.ref_name }}.zip
