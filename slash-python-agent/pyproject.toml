[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slash-agent"
version = "0.1.0"
description = "Slash 로컬 에이전트 — Python 구현 (Electron agent-app 대체)"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.0",
    "pystray>=0.19",
    "Pillow>=10.0",
    "websockets>=13.0",
    "cryptography>=42.0",
    "psutil>=5.9",
    "watchdog>=6.0",
    "pywebview>=6.0",
]

[project.scripts]
slash-agent-tray = "slash_agent.tray_app:main"
slash-agent-cli = "slash_agent.cli:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # 시험 전용 fake_agent_server.py가 HTTP(REST)+WS를 같은 포트에서 서빙하기 위해서만 씀 —
    # 실제 배포되는 에이전트는 안 씀(runtime dependencies에는 없음)
    "aiohttp>=3.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
